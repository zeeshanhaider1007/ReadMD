/div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-HASH-1" data-look="classic" transform="translate(171.75, 249.5)"><rect class="basic label-container" style="fill:#e6ffe6 !important;stroke:#00cc00 !important;stroke-width:2px !important" x="-128.75" y="-51" width="257.5" height="102"/><g class="label" style="" transform="translate(-98.75, -36)"><rect/><foreignObject width="197.5" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>HASH FUNCTION<br />Converts key to array index<br />hash('Maya') = index 7</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-BUCKET-3" data-look="classic" transform="translate(171.75, 426.5)"><rect class="basic label-container" style="fill:#e6ffe6 !important;stroke:#00cc00 !important" x="-124.0390625" y="-51" width="248.078125" height="102"/><g class="label" style="" transform="translate(-94.0390625, -36)"><rect/><foreignObject width="188.078125" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>BUCKET[7]<br />Stores: {'Maya', '555-0101'}<br />Data: (Key, Value) pair</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-CODE-7" data-look="classic" transform="translate(1137.71875, 261.5)"><rect class="basic label-container" style="" x="-130" y="-111" width="260" height="222"/><g class="label" style="" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>struct Entry {<br />    char key[50];<br />    char value[100];<br />};<br />struct Entry table[100];<br />// hash('Maya') = 7<br />// table[7] = {'Maya', '555-0101'}</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-ANALOGY-8" data-look="classic" transform="translate(1432.0625, 261.5)"><rect class="basic label-container" style="fill:#ffffe6 !important;stroke:#cccc00 !important" x="-114.34375" y="-75" width="228.6875" height="150"/><g class="label" style="" transform="translate(-84.34375, -60)"><rect/><foreignObject width="168.6875" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Everyday Analogy:<br />Name → Phone number<br />Word → Definition<br />That's a hash table!<br />O(1) lookup - INSTANT!</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>