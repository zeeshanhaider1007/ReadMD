k-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Library Collection<br />= Total available memory (RAM)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-BORROW-1" data-look="classic" transform="translate(324.14453125, 297.5)"><rect class="basic label-container" style="fill:#e6f3ff !important;stroke:#0066cc !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>You request a book<br />= malloc(size)<br />'We need a book on gardening'<br />Returns: shelf location</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-READ-2" data-look="classic" transform="translate(324.14453125, 510.5)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>You read the book<br />= Use the allocated memory<br />p[0] to p[4999]</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-RETURN-3" data-look="classic" transform="translate(173, 735.5)"><rect class="basic label-container" style="fill:#e6ffe6 !important;stroke:#00cc00 !important;stroke-width:2px !important" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>You finish and return the book<br />= free(p)<br />Book goes back to the shelf</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-LOST-4" data-look="classic" transform="translate(475.2890625, 735.5)"><rect class="basic label-container" style="fill:#ffe6e6 !important;stroke:#cc0000 !important;stroke-width:2px !important" x="-122.2890625" y="-63" width="244.578125" height="126"/><g class="label" style="" transform="translate(-92.2890625, -48)"><rect/><foreignObject width="184.578125" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Book NEVER returned<br />= Memory leak!<br />Book stuck forever<br />Eventually: no books left!</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-DANGLE-5" data-look="classic" transform="translate(173, 948.5)"><rect class="basic label-container" style="fill:#ffcccc !important;stroke:#ff0000 !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Book returned but you still<br />send letters to its old shelf<br />= Dangling pointer!<br />Letters go to the WRONG book!</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>