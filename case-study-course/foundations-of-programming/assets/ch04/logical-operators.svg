le; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>&amp;&amp; (Logical AND)<br />Both conditions must be true</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-T1-3" data-look="classic" transform="translate(173, 345.5)"><rect class="basic label-container" style="" x="-127.4765625" y="-51" width="254.953125" height="102"/><g class="label" style="" transform="translate(-97.4765625, -36)"><rect/><foreignObject width="194.953125" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Example:<br />age &gt;= 18 &amp;&amp; hasID == true<br />Both needed to enter</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-OR-1" data-look="classic" transform="translate(474.5625, 96.5)"><rect class="basic label-container" style="fill:#e6ffe6 !important;stroke:#00cc00 !important" x="-121.5625" y="-39" width="243.125" height="78"/><g class="label" style="" transform="translate(-91.5625, -24)"><rect/><foreignObject width="183.125" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>|| (Logical OR)<br />At least one must be true</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-T2-4" data-look="classic" transform="translate(474.5625, 345.5)"><rect class="basic label-container" style="" x="-113.4296875" y="-51" width="226.859375" height="102"/><g class="label" style="" transform="translate(-83.4296875, -36)"><rect/><foreignObject width="166.859375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Example:<br />isWeekend || isHoliday<br />Either one is enough</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-NOT-2" data-look="classic" transform="translate(745.796875, 96.5)"><rect class="basic label-container" style="fill:#ffe6e6 !important;stroke:#cc0000 !important" x="-99.671875" y="-39" width="199.34375" height="78"/><g class="label" style="" transform="translate(-69.671875, -24)"><rect/><foreignObject width="139.34375" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>! (Logical NOT)<br />Reverses true/false</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-T3-5" data-look="classic" transform="translate(745.796875, 345.5)"><rect class="basic label-container" style="" x="-98.71875" y="-51" width="197.4375" height="102"/><g class="label" style="" transform="translate(-68.71875, -36)"><rect/><foreignObject width="137.4375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Example:<br />!isClosed<br />Open if NOT closed</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-SC-12" data-look="classic" transform="translate(1024.515625, 345.5)"><rect class="basic label-container" style="fill:#e6f3ff !important;stroke:#0066cc !important;stroke-dasharray:5 5 !important" x="-130" y="-123" width="260" height="246"/><g class="label" style="" transform="translate(-100, -108)"><rect/><foreignObject width="200" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Short-Circuit Evaluation:<br /><br />A &amp;&amp; B: if A is false, B is NEVER evaluated<br />A || B: if A is true, B is NEVER evaluated<br /><br />This prevents errors AND saves time!</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-TRUTHTABLE-13" data-look="classic" transform="translate(598.7578125, 655)"><rect class="basic label-container" style="fill:#ffffe6 !important;stroke:#cccc00 !important;stroke-width:2px !important" x="-123.140625" y="-99" width="246.28125" height="198"/><g class="label" style="" transform="translate(-93.140625, -84)"><rect/><foreignObject width="186.28125" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Truth Table:<br /><br />A      B      A&amp;&amp;B   A||B   !A<br />false  false  false  false  true<br />false  true   false  true   true<br />true   false  false  true   false<br />true   true   true   true   false</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>