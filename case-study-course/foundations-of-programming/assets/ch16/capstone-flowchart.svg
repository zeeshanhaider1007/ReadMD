class="nodeLabel"><p>1. Choose Your Project<br />Ideas: Text analyzer, data sorter,<br />file processor, mini-database,<br />encryption tool, or your own idea!</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-DESIGN-1" data-look="classic" transform="translate(173, 429.5)"><rect class="basic label-container" style="fill:#e6f3ff !important;stroke:#0066cc !important;stroke-width:2px !important" x="-130" y="-111" width="260" height="222"/><g class="label" style="" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>2. Design (design-document.md)<br />- What data structures?<br />- What functions?<br />- What files?<br />- Draw the architecture<br />        <br />plan BEFORE coding!</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-IMPLEMENT-2" data-look="classic" transform="translate(173, 738.5)"><rect class="basic label-container" style="" x="-130" y="-123" width="260" height="246"/><g class="label" style="" transform="translate(-100, -108)"><rect/><foreignObject width="200" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>3. Implement (implementation.md)<br />- Write code section by section<br />- Compile OFTEN (every 5-10 lines)<br />- Fix warnings AS THEY APPEAR<br />- Use git for version control</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-TEST-3" data-look="classic" transform="translate(173, 1095.5)"><rect class="basic label-container" style="fill:#e6ffe6 !important;stroke:#00cc00 !important;stroke-width:2px !important" x="-130" y="-135" width="260" height="270"/><g class="label" style="" transform="translate(-100, -120)"><rect/><foreignObject width="200" height="240"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>4. Test (testing-debugging.md)<br />- Test each function individually<br />- Test edge cases (empty files, big data)<br />- Use valgrind (no memory leaks!)<br />- Fix all bugs before moving on</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-PRESENT-4" data-look="classic" transform="translate(173, 1416.5)"><rect class="basic label-container" style="fill:#ffffe6 !important;stroke:#cccc00 !important" x="-130" y="-87" width="260" height="174"/><g class="label" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>5. Present (presentation.md)<br />- Show it working<br />- Explain what you built<br />- What was hardest?<br />- What would you add?</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-RULES-15" data-look="classic" transform="translate(518, 774.5)"><rect class="basic label-container" style="fill:#ffe6e6 !important;stroke:#cc0000 !important;stroke-dasharray:5 5 !important" x="-130" y="-87" width="260" height="174"/><g class="label" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>GOLDEN RULES:<br />- Compile EVERY 5 lines<br />- Test BEFORE moving on<br />- No memory leaks allowed<br />- If stuck: DRAW it on paper first</p></span></div></foreignObject></g></g></g></g></g><d