n></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-HIGH-4" data-look="classic" transform="translate(1153.1000000014901, 540.6000000014901)"><rect class="basic label-container" style="fill:#e6ffe6 !important;stroke:#00cc00 !important" x="-130" y="-99" width="260" height="198"/><g class="label" style="" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>High-Level Languages<br />Python: x = 42<br />Java: int x = 42<br />JavaScript: let x = 42<br />HIDE: memory, types, pointers<br />'Just works' (like magic)</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-TEACH-7" data-look="classic" transform="translate(1498.0999755859375, 342.54998779296875)"><rect class="basic label-container" style="fill:#ffffe6 !important;stroke:#cccc00 !important;stroke-width:2px !important" x="-130" y="-123" width="260" height="246"/><g class="label" style="" transform="translate(-100, -108)"><rect/><foreignObject width="200" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Why learn C first?<br />↓<br />You understand what Python<br />is hiding from you<br />↓<br />You write better Python<br />because you know what's<br />REALLY happening</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>